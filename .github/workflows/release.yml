# Buduje paczki na trzech systemach i podpina je do release'u.
# Odpowiednik release.yml z wersji Electronowej, przełożony na tauri-action.
#
# Uruchamia się po wypchnięciu tagu `v*` (albo ręcznie z zakładki Actions). Każdy system
# buduje się na swoim runnerze — Tauri nie umie cross-compilować WebView.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # potrzebne, by dograć pliki do release'u

jobs:
  build:
    strategy:
      fail-fast: false # jeden system nie może zabrać reszty
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK 4.1 + libsoup3 to zależności buildowe Tauri v2 na Linuksie;
      # rpm/patchelf są potrzebne do paczek .rpm i AppImage.
      - name: Zależności systemowe (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
                                  patchelf rpm libssl-dev pkg-config

      # ssh2 buduje OpenSSL ze źródeł (vendored-openssl) — na Windowsie potrzebuje Perla
      # i NASM-a. Oba są preinstalowane na windows-latest, więc tylko je odsłaniamy.
      # ssh2 buduje OpenSSL ze zrodel (vendored-openssl) — na Windowsie potrzebuje Perla
      # (jest preinstalowany) oraz NASM-a do asemblera OpenSSL-a (nie ma go w obrazie).
      - name: Perl i NASM (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - run: npm ci

      # Bramka: typy frontendu + self-check logiki alternate screen, na której stoi vim mode.
      - run: npx tsc --noEmit -p tsconfig.json
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: BrainDead ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
